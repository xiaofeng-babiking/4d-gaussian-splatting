[project]
name = "fourd-gaussian-splatting"
version = "0.1.0"
description = "Real-time Photorealistic Dynamic Scene Representation and Rendering with 4D Gaussian Splatting"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "tqdm>=4.67",
    "torchmetrics>=1.4,<2",
    "imagesize>=1.4",
    "kornia>=0.7,<0.9",
    "omegaconf>=2.3",
    "plyfile>=1.0",
    "numpy>=1.26,<3",
    "tensorboard>=2.16",
    "simple-knn",
    "pointops2",
    # diff-gaussian-rasterization is NOT a pip dep: gaussian_renderer/diff_gaussian_rasterization.py
    # JIT-compiles the CUDA sources at first import via torch.utils.cpp_extension.load().
    # Its in-tree setup.py is vestigial from upstream Inria 3DGS and would fail (no
    # diff_gaussian_rasterization/ Python package dir in this repo).
    "gsplat>=1.5",
    "viser>=0.2",
]

[tool.uv]
package = false
no-build-isolation-package = [
    "simple-knn",
    "pointops2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
simple-knn = { path = "./simple-knn" }
pointops2 = { path = "./pointops2" }

[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# Pytorch's CUDA wheels are not exposed as a PEP-503 index by Aliyun's mirror —
# we keep the official URL here for *resolution* so uv lock can find versions /
# read METADATA. The actual wheel URLs in uv.lock are then rewritten to
# mirrors.aliyun.com/pytorch-wheels/cu128/<file> (byte-identical mirror) for
# fast downloads. See scripts/uv_lock_swap_mirror.sh (or the sed command).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Declare metadata for the local CUDA extensions so uv does not need to
# import their setup.py (which itself imports torch) during resolution.
[[tool.uv.dependency-metadata]]
name = "simple-knn"
version = "0.0.0"
requires-dist = ["torch"]

[[tool.uv.dependency-metadata]]
name = "pointops2"
version = "1.0"
requires-dist = ["torch", "numpy"]

[tool.black]
line-length = 88
target-version = ["py312"]
# Skip vendored third-party CUDA extensions and dataset/output dirs so a stray
# `black .` from CLI never reformats upstream code we don't own.
extend-exclude = '''
(
  /(diff-gaussian-rasterization|pointops2|simple-knn|lpipsPyTorch)/
  | /(output|data|\.venv)/
)
'''
